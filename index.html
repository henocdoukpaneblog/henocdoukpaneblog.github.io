<html lang="en">

<title>Analysis Blog</title>
<meta name="description" content="Analysis and reactions on political science, current affairs, youth issues and governance, across Africa and around the world.">

<meta name="theme-color" content="#fff6ea">

<style>
:root{color-scheme:light;--ink:#1d2b2a;--mut:#5d6f6c;--teal:#0e7c74;--teal2:#14a89d;--gold:#f2a93b;--coral:#e5604d;--card:rgba(255,255,255,.82);--line:rgba(14,124,116,.16);
--serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.75 var(--sans);
background:radial-gradient(900px 500px at 90% -10%,#ffd9a8 0,transparent 60%),radial-gradient(800px 500px at -10% 10%,#bff0e6 0,transparent 55%),linear-gradient(180deg,#fff6ea 0,#fdebdc 45%,#e6f5f0 100%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff6ea;z-index:30}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,248,238,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar-in{max-width:none;margin:0;padding:10px 14px;display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;display:flex;align-items:center;justify-content:center;font:700 16px var(--sans);overflow:hidden;text-decoration:none;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--gold)}
.av img,.bio-av img{width:100%;height:100%;object-fit:cover}
.brand{flex:1;font:800 22px var(--serif);color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.burger{width:46px;height:46px;border:1px solid var(--line);background:#fff;border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer;padding:0;box-shadow:0 2px 8px rgba(14,124,116,.1)}
.burger span{display:block;width:20px;height:2.5px;background:var(--teal);border-radius:2px}
.menu{display:none;max-width:none;margin:0;padding:0 14px 14px}
.menu.open{display:block}
.menu a{display:block;padding:13px 16px;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;font:500 16px var(--sans);box-shadow:0 2px 8px rgba(14,124,116,.06)}
.menu a:hover{border-color:var(--teal);color:var(--teal)}
main{max-width:720px;margin:0 auto;padding:26px 20px 72px}
a{color:var(--teal)}
.hero{text-align:center;padding:30px 8px 18px}
.hero .kick{display:inline-block;font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--coral);background:#fff;border-radius:99px;padding:5px 14px;box-shadow:0 2px 8px rgba(229,96,77,.15)}
.hero h1{font:800 clamp(38px,9vw,60px)/1.05 var(--serif);margin:16px 0 12px;letter-spacing:-.02em;background:linear-gradient(100deg,var(--teal) 0,var(--teal2) 45%,var(--coral) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:520px;margin:0 auto;color:var(--mut);font-size:18px}
.rule{height:4px;width:70px;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--coral));margin:22px auto 0}
.card{background:var(--card);border:1px solid #fff;border-radius:18px;padding:20px 22px;margin:16px 0;box-shadow:0 10px 30px rgba(14,124,116,.10);transition:transform .2s,box-shadow .2s}
a.card-link{display:block;text-decoration:none;color:inherit}
a.card-link:hover .card,.card.hov:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(14,124,116,.16)}
.card h2{font:700 22px/1.3 var(--serif);margin:8px 0 6px;color:var(--ink)}
.card p{margin:6px 0 0;color:var(--mut)}
.more{display:inline-block;margin-top:10px;font:600 14px var(--sans);color:var(--teal)}
.meta{color:var(--mut);font:13px var(--sans)}
.tag{display:inline-block;border-radius:99px;padding:1px 11px;margin-right:8px;font:600 12px var(--sans);color:#fff;background:linear-gradient(90deg,var(--teal),var(--teal2))}
.tag.fr{background:linear-gradient(90deg,var(--gold),var(--coral))}
h3.sec{font:700 13px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin:26px 0 2px}
h1.page{font:800 clamp(28px,7vw,38px)/1.2 var(--serif);margin:10px 0 14px;letter-spacing:-.01em}
.bio-av{width:132px;height:132px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;display:flex;align-items:center;justify-content:center;font:700 44px var(--sans);overflow:hidden;box-shadow:0 0 0 5px #fff,0 0 0 8px var(--gold)}
.back{display:inline-block;margin-bottom:6px;font:600 15px var(--sans);text-decoration:none}
article p{font-size:18px}
.pic{display:block;width:100%;height:auto;border-radius:14px;margin:0 0 14px}
.thumb{display:block;width:100%;max-height:220px;object-fit:cover;object-position:center 60%;border-radius:12px;margin:0 0 12px}
footer{text-align:center;color:var(--mut);font:13px var(--sans);margin-top:44px}

#prog{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:0;background:linear-gradient(90deg,var(--gold),var(--coral));z-index:40}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-block;padding:11px 22px;border-radius:99px;font:600 15px var(--sans);text-decoration:none;cursor:pointer;border:0}
.btn.p{background:linear-gradient(90deg,var(--teal),var(--teal2));color:#fff;box-shadow:0 8px 20px rgba(14,124,116,.3)}
.btn.s{background:#fff;color:var(--teal);border:1px solid var(--line)}
.stats{display:flex;justify-content:center;gap:30px;margin:28px 0 4px;font:13px var(--sans);color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.stats b{display:block;font:800 28px var(--serif);color:var(--ink);letter-spacing:0}
.tools{margin:10px 0 4px}
.tools input{width:100%;box-sizing:border-box;padding:13px 18px;border-radius:99px;border:1px solid var(--line);background:#fff;font:16px var(--sans);outline:none;box-shadow:0 4px 14px rgba(14,124,116,.06)}
.tools input:focus{border-color:var(--teal)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;font:600 13px var(--sans);color:var(--teal);cursor:pointer;text-decoration:none}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.share{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 18px}
.share span{font:600 13px var(--sans);color:var(--mut);margin-right:4px}
.empty{text-align:center;color:var(--mut)}
.card{animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:0;background:var(--teal);color:#fff;font-size:20px;display:none;z-index:25;cursor:pointer;box-shadow:0 8px 20px rgba(14,124,116,.35)}
.flinks{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;font-size:14px}
.flinks a{text-decoration:none;font-weight:600}
footer{border-top:1px solid var(--line);padding-top:22px}

:root[data-theme="dark"]{color-scheme:dark;--ink:#eef3f2;--mut:#a7b7b4;--teal:#2dd4bf;--teal2:#5eead4;--gold:#f5b94a;--coral:#ff7a63;--card:rgba(22,31,44,.72);--line:rgba(94,234,212,.18)}
:root[data-theme="dark"] body{background:radial-gradient(900px 520px at 92% -10%,rgba(245,185,74,.24),transparent 60%),radial-gradient(800px 600px at -10% 8%,rgba(45,212,191,.22),transparent 55%),radial-gradient(700px 500px at 50% 110%,rgba(255,122,99,.12),transparent 60%),linear-gradient(180deg,#0b1118 0,#101a27 55%,#0c131d 100%);background-attachment:fixed}
:root[data-theme="dark"] body::before{background:#0b1118}
:root[data-theme="dark"] body::after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(480px 380px at 20% 30%,rgba(45,212,191,.13),transparent 60%),radial-gradient(520px 400px at 80% 70%,rgba(245,185,74,.11),transparent 60%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,3%,0) scale(1.1)}}
:root[data-theme="dark"] .bar{background:rgba(11,17,24,.78)}
:root[data-theme="dark"] .av,:root[data-theme="dark"] .bio-av{color:#06231f;box-shadow:0 0 0 3px #0b1118,0 0 0 5px var(--gold),0 0 24px rgba(245,185,74,.35)}
:root[data-theme="dark"] .burger,:root[data-theme="dark"] .mode{background:rgba(255,255,255,.06);box-shadow:none}
:root[data-theme="dark"] .burger span{background:var(--teal2)}
:root[data-theme="dark"] .menu a{background:rgba(255,255,255,.05);box-shadow:none}
:root[data-theme="dark"] .hero .kick{background:rgba(255,255,255,.08);color:var(--gold);box-shadow:none}
:root[data-theme="dark"] .hero h1{background:linear-gradient(100deg,#5eead4 0,#f5b94a 60%,#ff7a63 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="dark"] .card{border-color:rgba(255,255,255,.09);box-shadow:0 12px 32px rgba(0,0,0,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
:root[data-theme="dark"] a.card-link:hover .card,:root[data-theme="dark"] .card.hov:hover{box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 0 1px rgba(94,234,212,.35)}
:root[data-theme="dark"] .tools input{background:rgba(255,255,255,.06);color:var(--ink);box-shadow:none}
:root[data-theme="dark"] .chip{background:rgba(255,255,255,.05)}
:root[data-theme="dark"] .chip.on{background:var(--teal);color:#06231f}
:root[data-theme="dark"] .btn.s{background:rgba(255,255,255,.06);color:var(--teal2)}
:root[data-theme="dark"] .btn.p{background:linear-gradient(90deg,var(--teal),var(--gold));color:#06231f;box-shadow:0 8px 24px rgba(45,212,191,.28)}
:root[data-theme="dark"] .tag{color:#06231f;background:linear-gradient(90deg,var(--teal),var(--teal2))}
:root[data-theme="dark"] .tag.fr{background:linear-gradient(90deg,var(--gold),var(--coral))}
:root[data-theme="dark"] .top{color:#06231f}
.mode{width:46px;height:46px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:20px;cursor:pointer;padding:0;color:var(--teal)}
.subh{font:700 21px var(--serif);margin:26px 0 2px;color:var(--ink)}
.asp{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.asp:first-child{border-top:0}
.asp i{flex:none;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--gold));color:#fff;font:700 14px var(--sans);font-style:normal;display:flex;align-items:center;justify-content:center}
.asp.hl i{box-shadow:0 0 0 3px var(--coral)}
</style>
<script>var _t;try{_t=localStorage.getItem("theme")}catch(e){}document.documentElement.setAttribute("data-theme",_t||"dark")</script>

var BIO=["I am Henoc Doukpane, a political scientist holding a Master’s degree (Master 2) in political science.","My work is devoted to understanding how power is organized, contested and exercised. I publish scientific articles in political science, with one constant ambition: to bring rigor and clarity to the questions that shape our societies.","I also contribute to the African Union’s Agenda 2063, the continental vision of the Africa we want: integrated, prosperous and led by its own people.","Through this blog, I share analyses and reactions on Africa and on current affairs in general, with particular attention to youth and governance."];

 body:["From 16 November 2026, Addis Ababa will welcome young people, policymakers and institutions from across the continent for the Pan-African Youth Forum (PAYF), hosted at the African Union headquarters in Ethiopia. Beyond the ceremony, the gathering poses a demanding question: what has twenty years of the African Youth Charter really changed?",
"## A Charter that turns twenty",
"The African Youth Charter was adopted by African Union leaders in 2006 and entered into force in 2009. It was a landmark: for the first time, a continental legal instrument recognized young people as rights-holders and as partners in development, rather than as a problem to be managed. The Charter also gave Africa a shared date to celebrate its youth, as 1 November was proclaimed Africa Youth Day.",
"The Pan-African Youth Forum grew out of that spirit. Since a 2017 decision of the African Union Assembly, it has been institutionalized as an annual space held alongside Africa Youth Day, designed to bring youth voices into continental decision-making. The previous edition, held in Oran, Algeria, in November 2024, placed education at its centre under the banner “1 Million Next Level is Knocking.”",
"## The 2026 edition: reflect, reimagine, reposition",
"The Commission of the African Union, through its Women, Gender and Youth Directorate, has placed the anniversary under the theme “Reflecting, Reimagining, and Repositioning the African Youth Charter.” The three verbs form a method. To reflect is to take honest stock of the last twenty years. To reimagine is to ask whether the Charter’s promises still fit a continent that is more urban, more connected and more digital than in 2006. To reposition is to decide how the Charter will be used, financed and monitored in the years ahead.",
"The programme reflects that ambition. Alongside the formal sessions, it includes a presidential dialogue with young people, an innovation exhibition, a career fair, masterclasses and cultural activities. The mix is telling: participation is understood not only as speaking, but also as learning, creating and working.",
"## Five questions worth asking",
"From the standpoint of political science and governance, five questions deserve attention at this forum. First, implementation: how many Member States have turned the Charter’s commitments into national youth policies backed by real budgets? Second, representation: are young people sitting at the tables where laws and budgets are decided, or only at the tables that discuss them? Third, employment: can education and skills training lead to dignified work for the millions of young Africans entering the labour market every year? Fourth, accountability: who measures progress, with which indicators, and who reports it publicly? Fifth, ownership: can youth programmes rely increasingly on domestic resources and youth-led organizations, rather than on external support alone?",
"## Why it matters for Agenda 2063",
"These questions connect directly to Agenda 2063, the African Union’s long-term vision of an integrated, prosperous and peaceful Africa. That vision places young people at its heart, and it cannot be achieved without them. A forum can inspire; it is institutions, budgets and political courage that deliver. The real measure of this anniversary will therefore not be the quality of the speeches, but the clarity of the commitments that follow.",
"I will follow the discussions closely and share my reactions here as the forum unfolds."]},

 body:["Welcome to Analysis Blog, a space devoted to thinking carefully about the political questions that shape our societies.","Here I offer analyses and reactions on political science, current affairs, youth issues and governance, across Africa and beyond: the ideas, the institutions and the choices that decide how power is exercised and whose voices are heard.","Young people are not only the future; they are a force of the present. This blog treats youth issues with the seriousness they deserve, and looks at governance with a demanding eye, asking for transparency, accountability and genuine participation.","I will write as events call for it, with one aim: to inform, to question and to open a conversation. You are warmly invited to read, reflect and share."]}
