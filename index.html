<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Analysis Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#1d2b2a;--mut:#5d6f6c;--teal:#0e7c74;--teal2:#14a89d;--gold:#f2a93b;--coral:#e5604d;--card:rgba(255,255,255,.82);--line:rgba(14,124,116,.16);
--serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.75 var(--sans);
background:radial-gradient(900px 500px at 90% -10%,#ffd9a8 0,transparent 60%),radial-gradient(800px 500px at -10% 10%,#bff0e6 0,transparent 55%),linear-gradient(180deg,#fff6ea 0,#fdebdc 45%,#e6f5f0 100%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff6ea;z-index:30}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,248,238,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;display:flex;align-items:center;justify-content:center;font:700 16px var(--sans);overflow:hidden;text-decoration:none;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--gold)}
.av img,.bio-av img{width:100%;height:100%;object-fit:cover}
.brand{flex:1;font:800 22px var(--serif);color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.burger{width:46px;height:46px;border:1px solid var(--line);background:#fff;border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer;padding:0;box-shadow:0 2px 8px rgba(14,124,116,.1)}
.burger span{display:block;width:20px;height:2.5px;background:var(--teal);border-radius:2px}
.menu{display:none;max-width:760px;margin:0 auto;padding:0 18px 14px}
.menu.open{display:block}
.menu a{display:block;padding:13px 16px;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;font:500 16px var(--sans);box-shadow:0 2px 8px rgba(14,124,116,.06)}
.menu a:hover{border-color:var(--teal);color:var(--teal)}
main{max-width:720px;margin:0 auto;padding:26px 20px 72px}
a{color:var(--teal)}
.hero{text-align:center;padding:30px 8px 18px}
.hero .kick{display:inline-block;font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--coral);background:#fff;border-radius:99px;padding:5px 14px;box-shadow:0 2px 8px rgba(229,96,77,.15)}
.hero h1{font:800 clamp(38px,9vw,60px)/1.05 var(--serif);margin:16px 0 12px;letter-spacing:-.02em;background:linear-gradient(100deg,var(--teal) 0,var(--teal2) 45%,var(--coral) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:520px;margin:0 auto;color:var(--mut);font-size:18px}
.rule{height:4px;width:70px;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--coral));margin:22px auto 0}
.card{background:var(--card);border:1px solid #fff;border-radius:18px;padding:20px 22px;margin:16px 0;box-shadow:0 10px 30px rgba(14,124,116,.10);transition:transform .2s,box-shadow .2s}
a.card-link{display:block;text-decoration:none;color:inherit}
a.card-link:hover .card,.card.hov:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(14,124,116,.16)}
.card h2{font:700 22px/1.3 var(--serif);margin:8px 0 6px;color:var(--ink)}
.card p{margin:6px 0 0;color:var(--mut)}
.more{display:inline-block;margin-top:10px;font:600 14px var(--sans);color:var(--teal)}
.meta{color:var(--mut);font:13px var(--sans)}
.tag{display:inline-block;border-radius:99px;padding:1px 11px;margin-right:8px;font:600 12px var(--sans);color:#fff;background:linear-gradient(90deg,var(--teal),var(--teal2))}
.tag.fr{background:linear-gradient(90deg,var(--gold),var(--coral))}
h3.sec{font:700 13px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin:26px 0 2px}
h1.page{font:800 clamp(28px,7vw,38px)/1.2 var(--serif);margin:10px 0 14px;letter-spacing:-.01em}
.bio-av{width:132px;height:132px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;display:flex;align-items:center;justify-content:center;font:700 44px var(--sans);overflow:hidden;box-shadow:0 0 0 5px #fff,0 0 0 8px var(--gold)}
.back{display:inline-block;margin-bottom:6px;font:600 15px var(--sans);text-decoration:none}
article p{font-size:18px}
footer{text-align:center;color:var(--mut);font:13px var(--sans);margin-top:44px}
</style>
</head>
<body>
<div class="bar">
 <div class="bar-in">
  <a class="av" id="av" href="#home" aria-label="Home"></a>
  <a class="brand" href="#home">Analysis Blog</a>
  <button class="burger" id="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
 </div>
 <nav class="menu" id="menu">
  <a href="#home">Articles</a>
  <a href="#biography">Biography</a>
  <a href="#themes">Themes</a>
  <a href="#contact">Contact</a>
 </nav>
</div>
<main>
<div id="view"></div>
<footer>© <span id="y"></span> Henoc Doukpane · Lomé, Togo</footer>
</main>
<script>
/* ====== EDIT HERE ====== */
var NAME="Henoc Doukpane";
var INITIALS="HD";
var PHOTO="photo.jpg"; // upload an image named photo.jpg next to index.html
var CONTACT="doukpaneyindouyab@gmail.com";
var TAGLINE="Analysis and reactions on digital technology, education and constitutional law, with a focus on Togo.";
var BIO=["I am Henoc Doukpane, based in Lomé, Togo. I hold the Togolese Baccalaureate and spent five years at the restaurant “Le Bon Goût” in Lomé, a school of discipline and of dealing with people.","Today I write and reflect on digital technology, education and constitutional law. This blog gathers my articles and my reactions to current events."];
var THEMES=[["Digital technology","Uses, challenges and opportunities of the digital world."],["Education","Reflections on schools, training and learning."],["Constitutional law","Analyses of and reactions to legal developments, with a focus on Togo."]];
// To add an article: copy a block, change id (no spaces or accents), date, tag, title and paragraphs.
var ARTICLES=[
{id:"welcome",date:"October 30, 2026",tag:"Introduction",title:"Welcome to Analysis Blog",
 body:["This blog is a space to share my readings, reactions and analyses of current events.","I will write from time to time, without a fixed schedule, about digital technology, education and constitutional questions, with a view on Togo."]},
{id:"sample-reaction",date:"October 30, 2026",tag:"Reaction",title:"Title of a first reaction (sample)",
 body:["This is a sample article: replace this text with your own reaction to current events.","Each paragraph is one line in the “body” list."]}
];
/* ======================== */
var v=document.getElementById("view"),menu=document.getElementById("menu"),burger=document.getElementById("burger");
document.getElementById("y").textContent=new Date().getFullYear();
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function avatar(el){el.textContent=INITIALS;var i=new Image();i.alt=NAME;i.onload=function(){el.textContent="";el.appendChild(i)};i.src=PHOTO}
avatar(document.getElementById("av"));
burger.onclick=function(){var o=menu.classList.toggle("open");burger.setAttribute("aria-expanded",o)};
function paras(a){return a.map(function(p){return"<p>"+esc(p)+"</p>"}).join("")}
function tag(a){return'<span class="tag'+(a.lang==="fr"?" fr":"")+'">'+esc(a.tag)+'</span>'}
function render(){
 menu.classList.remove("open");burger.setAttribute("aria-expanded","false");
 var k=(location.hash||"#home").slice(1),h="";
 if(k==="biography"){h='<div class="card" style="text-align:center"><div class="bio-av" id="bav"></div><h1 class="page">'+esc(NAME)+'</h1><div style="text-align:left">'+paras(BIO)+'</div></div>'}
 else if(k==="themes"){h='<h3 class="sec">Themes</h3>'+THEMES.map(function(t){return'<div class="card hov"><h2>'+esc(t[0])+'</h2><p>'+esc(t[1])+'</p></div>'}).join("")}
 else if(k==="contact"){h='<h3 class="sec">Contact</h3><div class="card"><p style="margin:0;color:var(--ink)">To get in touch, write to <a href="mailto:'+CONTACT+'">'+CONTACT+'</a></p></div>'}
 else{
  var a=ARTICLES.filter(function(x){return x.id===k})[0];
  if(a){h='<a class="back" href="#home">← All articles</a><article'+(a.lang?' lang="'+a.lang+'"':'')+'><div>'+tag(a)+'<span class="meta">'+esc(a.date)+'</span></div><h1 class="page">'+esc(a.title)+'</h1><div class="card">'+paras(a.body)+'</div></article>'}
  else{h='<section class="hero"><span class="kick">Blog</span><h1>Analysis Blog</h1><p>'+esc(TAGLINE)+'</p><div class="rule"></div></section><h3 class="sec">Latest articles</h3>'+ARTICLES.map(function(a){return'<a class="card-link" href="#'+a.id+'"><div class="card"'+(a.lang?' lang="'+a.lang+'"':'')+'>'+tag(a)+'<span class="meta">'+esc(a.date)+'</span><h2>'+esc(a.title)+'</h2><p>'+esc(a.body[0])+'</p><span class="more">'+"Read"+' →</span></div></a>'}).join("")}
 }
 v.innerHTML=h;
 var b=document.getElementById("bav");if(b)avatar(b);
 window.scrollTo(0,0)}
window.addEventListener("hashchange",render);render();
</script>
</body>
</html>
